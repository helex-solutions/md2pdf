name: Docker image

# A release artifact that every installation pulls, so publishing stays a
# deliberate act — and pushing a version tag IS that act. A v* tag builds and
# publishes on its own; everything else is manual, dispatched from the ref you
# want built.
#
# Matches helex-solutions/mdbook, and for the same reason: a tag whose image is
# published by hand later is a tag whose README documents an image that does not
# exist yet.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: the git tag without "v", else <branch>-<short sha>)'
        type: string
        default: ''
      latest:
        description: 'Also publish :latest'
        type: boolean
        default: false
      push:
        description: 'Push to ghcr.io (untick to only build and smoke-test)'
        type: boolean
        default: true
      platforms:
        description: 'Target platforms — arm64 is emulated, so dropping it roughly halves the build'
        type: choice
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
        default: linux/amd64,linux/arm64

jobs:
  image:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_LATEST: ${{ inputs.latest }}
          EVENT: ${{ github.event_name }}
        run: |
          ref="${GITHUB_REF_NAME}"
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${ref#v}"
          else tag="${ref}-$(git rev-parse --short HEAD)"; fi
          # :latest is what the README's `docker run` gets, so a release number moves
          # it and a pre-release does not.
          if [ "$EVENT" = workflow_dispatch ]; then
            latest=$INPUT_LATEST
          elif printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            latest=true
          else
            latest=false
          fi
          tags="${IMAGE}:${tag}"
          [ "$latest" = "true" ] && tags="${tags},${IMAGE}:latest"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        # Empty on a tag push, and an empty string is falsey — a release tag
        # would otherwise build and publish nothing.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only useful if Chromium actually launches inside it, which
      # is exactly what a cross-platform build can break. /health answers 503
      # until a browser can be started, so this is the real check.
      - name: Smoke-test the image
        if: ${{ contains(inputs.platforms || 'linux/amd64,linux/arm64', 'linux/amd64') }}
        run: |
          docker build -t md2pdf-smoke --load .
          docker run -d --name md2pdf-smoke -p 18509:18509 md2pdf-smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18509/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          curl -sS http://127.0.0.1:18509/health
          curl -sS -X POST http://127.0.0.1:18509/pdf \
            -H 'Content-Type: application/json' \
            -d '{"html":"<h1>Propouštěcí zpráva</h1>","options":{"theme":"plain"}}' \
            -o /tmp/smoke.pdf
          head -c 5 /tmp/smoke.pdf | grep -q '%PDF-' || { echo "not a PDF"; exit 1; }
          docker logs md2pdf-smoke
          docker rm -f md2pdf-smoke
          [ "${ok:-0}" = "1" ] || exit 1
