<!-- Replaces @top-left/@top-center/@top-right from md2pdf-helex.css, which drew
     one 8mm green band across the three margin boxes. Chromium gives the whole
     page width here, so it is a single element. -->
<div style="width:100%;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;">
  <div style="height:8mm;background:#3cb6ab;-webkit-print-color-adjust:exact;print-color-adjust:exact;"></div>
</div>
